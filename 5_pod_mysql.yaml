apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-sql
  name: my-sql
  namespace: backend
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: zone
            operator: In
            values:
            - backend
  containers:
  - env:
    - name: MYSQL_ROOT_PASSWORD
      value: root
    image: mysql
    name: my-sql
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
