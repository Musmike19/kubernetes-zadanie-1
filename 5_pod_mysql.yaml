apiVersion: v1
kind: Pod
metadata:
  # Etykieta poda my-sql potrzebna w NetworkPolicy.
  labels:
    app: my-sql
  # Nazwa poda my-sql w przestrzeni backend.
  name: my-sql
  namespace: backend
spec:
  # Node Affinity: Wymusza uruchomienie bazy na tym samym węźle co pody Deploymentu backend (zone=backend).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: zone
            operator: In
            values:
            - backend
  containers:
  - env:
    - name: MYSQL_ROOT_PASSWORD
      value: root
    # Obraz MySQL dla poda my-sql.
    image: mysql
    name: my-sql
    # Zasoby dla poda my-sql, wymagane przez ResourceQuota w przestrzeni backend.
    # Zasoby dopasowane do limitów Quota backendu (500m i 512Mi RAM zostawia miejsce dla poda Deploymentu backend i poda generującego obciążenie).
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
